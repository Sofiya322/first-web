                    <label for="name"><i>E-mail</i></label><br>

                </div>
                <div>
                    <label for="textarea">
                        <i>Текст сообщения</i>
                    </label><br>
                    <textarea id="textarea" rows="7" placeholder="Добавить комментарий" required></textarea>

                    <input type="submit">
